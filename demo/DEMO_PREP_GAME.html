<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive CTO Demo — Prep Game</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252936;
      --border: #343848;
      --text: #e8eaef;
      --muted: #9aa3b5;
      --accent: #6c9eff;
      --accent-dim: #4a7ad4;
      --success: #3dd68c;
      --error: #ff6b7a;
      --warn: #f5c542;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.35rem; }
    .stats-bar {
      display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center;
      margin-bottom: 1.25rem;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.85rem;
      font-size: 0.8rem;
    }
    .stat strong { color: var(--accent); }
    .screen { display: none; animation: fade 0.25s ease; }
    .screen.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .card-grid { display: grid; gap: 0.75rem; }
    .mode-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .mode-card:hover { border-color: var(--accent); background: var(--surface2); }
    .mode-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .mode-card h3 { font-size: 1rem; margin-bottom: 0.25rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .mode-card .start-hint { font-size: 0.75rem; font-weight: 500; color: var(--accent); }
    .mode-card p { font-size: 0.85rem; color: var(--muted); }
    .mode-card .badge {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--muted);
    }
    .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    button, .btn {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #0f1117; font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: #85b0ff; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--muted); }
    .progress-wrap {
      height: 6px; background: var(--surface2); border-radius: 3px;
      margin-bottom: 1rem; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent);
      border-radius: 3px; transition: width 0.3s ease;
    }
    .question-meta {
      font-size: 0.75rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }
    .question-text {
      font-size: 1.05rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .options { display: grid; gap: 0.5rem; }
    .option {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      color: inherit;
      transition: border-color 0.12s, background 0.12s;
    }
    .option:hover:not(.locked) { border-color: var(--accent); }
    .option.correct { border-color: var(--success); background: rgba(61, 214, 140, 0.12); }
    .option.wrong { border-color: var(--error); background: rgba(255, 107, 122, 0.1); }
    .option.locked { cursor: default; }
    .feedback {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .feedback.good { border-color: var(--success); }
    .feedback.bad { border-color: var(--error); }
    .feedback a { color: var(--accent); }
    .sim-step-num {
      font-size: 2rem; font-weight: 700; color: var(--accent);
      line-height: 1;
    }
    .sim-context {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin: 0.75rem 0 1rem;
      font-size: 0.9rem;
    }
    .sim-context .say { color: var(--warn); margin-top: 0.5rem; font-style: italic; }
    .category-picks {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .chip {
      font-size: 0.78rem;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      color: var(--muted);
    }
    .chip.on { border-color: var(--accent); color: var(--accent); background: rgba(108, 158, 255, 0.12); }
    .results-hero {
      text-align: center;
      padding: 1.5rem 0;
    }
    .results-hero .score-big {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
    }
    .weak-list { margin-top: 1rem; font-size: 0.88rem; color: var(--muted); }
    .weak-list li { margin: 0.35rem 0 0 1.2rem; }
    footer.note {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    .keyboard-hint {
      font-family: ui-monospace, monospace;
      font-size: 0.82rem;
      background: var(--surface2);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Responsive CTO Demo Prep</h1>
      <p>Learn the pitch, clicks, prompts, and Q&A — sourced from your demo folder</p>
    </header>

    <div class="stats-bar" id="statsBar"></div>

    <!-- HOME -->
    <section class="screen active" id="screenHome">
      <div class="card-grid">
        <button type="button" class="mode-card" data-mode="quiz">
          <h3>Knowledge Quiz <span class="start-hint">Start →</span></h3>
          <p>Pitch, demo rules, architecture, competitive Q&A, and “what not to do.”</p>
          <span class="badge">~45 questions · pick topics</span>
        </button>
        <button type="button" class="mode-card" data-mode="simulator">
          <h3>Demo Step Simulator <span class="start-hint">Start →</span></h3>
          <p>Walk the 17 live-demo clicks in order — LEFT, CENTER, RIGHT, keyboard.</p>
          <span class="badge">From DEMO_CLICK_ONLY.md</span>
        </button>
        <button type="button" class="mode-card" data-mode="shortcuts">
          <h3>Mac Shortcut Drill <span class="start-hint">Start →</span></h3>
          <p>Match Cursor 3 shortcuts to actions (Shift+Cmd+L, Cmd+., etc.).</p>
          <span class="badge">From CURSOR_3_MAC_GUIDE.md</span>
        </button>
        <button type="button" class="mode-card" data-mode="prompts">
          <h3>Agent Prompt Recall <span class="start-hint">Start →</span></h3>
          <p>Fill in the blanks on PROMPT 1 & 2 — the hero demo moments.</p>
          <span class="badge">JIRA-4827 · SEC-1192</span>
        </button>
        <button type="button" class="mode-card" data-mode="boss">
          <h3>Final Boss Round <span class="start-hint">Start →</span></h3>
          <p>Mixed hard questions + simulator steps — pass at 80% to “demo ready.”</p>
          <span class="badge">Best score tracked</span>
        </button>
      </div>
      <footer class="note">Open <code>demo/MASTER_TALK_TRACK.md</code> for full talk track · <code>DEMO_CLICK_ONLY.md</code> to print clicks</footer>
    </section>

    <!-- QUIZ SETUP -->
    <section class="screen" id="screenQuizSetup">
      <p class="question-meta">Choose topics</p>
      <div class="category-picks" id="categoryPicks"></div>
      <div class="btn-row">
        <button class="btn-primary" id="startQuiz">Start quiz (10 questions)</button>
        <button class="btn-ghost" data-back>Back</button>
      </div>
    </section>

    <!-- PLAY -->
    <section class="screen" id="screenPlay">
      <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="question-meta" id="playMeta"></div>
      <div id="playBody"></div>
      <div class="btn-row" id="playActions" style="display:none">
        <button class="btn-primary" id="nextBtn">Next</button>
      </div>
    </section>

    <!-- RESULTS -->
    <section class="screen" id="screenResults">
      <div class="results-hero">
        <div class="score-big" id="resultScore">0%</div>
        <p id="resultMessage"></p>
      </div>
      <ul class="weak-list" id="weakList"></ul>
      <div class="btn-row" style="justify-content:center">
        <button class="btn-primary" id="retryBtn">Play again</button>
        <button class="btn-ghost" data-back>Home</button>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "responsiveDemoPrep_v1";

    const CATEGORIES = {
      pitch: { label: "Pitch & slides", color: "#6c9eff" },
      demo: { label: "Demo flow", color: "#3dd68c" },
      shortcuts: { label: "Shortcuts", color: "#f5c542" },
      technical: { label: "Code & rules", color: "#c792ea" },
      qa: { label: "Q&A", color: "#ff9f6b" },
      traps: { label: "Traps (don't do)", color: "#ff6b7a" },
    };

    const QUESTIONS = [
      { cat: "pitch", q: "How long is the full live session (pitch + demo + Q&A)?", opts: ["~10 minutes", "~15 minutes", "~25 minutes", "~45 minutes"], a: 1, explain: "MASTER_TALK_TRACK: ~5 pitch + ~5 demo + ~5 Q&A ≈ 15 minutes total." },
      { cat: "pitch", q: "Slide 1's core message is that development is shifting from…", opts: ["Autocomplete to plugins", "Assistance to agency", "Monoliths to microservices", "On-prem to cloud"], a: 1, explain: "Slide 1: 'assistance to agency' — multi-file outcomes, not just lines." },
      { cat: "pitch", q: "The CTO mandate you emphasize on slides is…", opts: ["Speed OR safety", "Speed AND risk mitigation", "Replace engineers with AI", "Move all work to the terminal"], a: 1, explain: "Velocity and risk—not either/or. Especially true for regulated enterprise software." },
      { cat: "pitch", q: "Cursor's four pillars on Slide 2 include all EXCEPT:", opts: ["Codebase-aware agents", "Rules & standards", "Model choice", "Built-in production deploy"], a: 3, explain: "Pillars: agents, Rules, model choice, enterprise trust. No deploy—you still use PR/CI." },
      { cat: "pitch", q: "A successful 90-day pilot for Responsive would typically be…", opts: ["500 seats company-wide on day 1", "1 platform team + 1 squad, 20–40 seats, 30 days", "Only interns for 7 days", "Replace all IDEs permanently first week"], a: 1, explain: "MASTER_TALK_TRACK Slide 3: measured pilot, cycle time on 3+ file tickets." },
      { cat: "pitch", q: "Responsive was formerly known as…", opts: ["Salesforce", "RFPIO", "ServiceNow", "DocuSign"], a: 1, explain: "SCENARIO_CARDS: formerly RFPIO; Strategic Response Management." },
      { cat: "pitch", q: "When comparing to Copilot at a high level, you position Cursor as…", opts: ["A GitHub plugin only", "Purpose-built AI IDE with repo-wide agents", "A database tool", "A slide generator"], a: 1, explain: "QA_PREP: Copilot = strong assist; Cursor = agentic, repo-wide work default." },
      { cat: "pitch", q: "When comparing to Claude Code, your honest positioning is…", opts: ["Claude Code is always better for everyone", "Cursor = full SDLC surface + visual diffs; Claude Code = CLI-first strength", "They are identical products", "Cursor only works with one model vendor"], a: 1, explain: "QA_PREP: terminal-native orgs may evaluate Claude Code; Cursor for breadth + governance." },
      { cat: "demo", q: "Where do you paste Agent prompts during the live demo?", opts: ["Center editor", "Terminal", "RIGHT panel Agent text box only", "Browser at cursor.com/agents"], a: 2, explain: "DEMO_CLICK_ONLY: NEVER paste prompts in the center—only RIGHT." },
      { cat: "demo", q: "You do NOT need for the interview demo:", opts: ["Cursor desktop + open folder", "npm install / deploy / server", "Agent prompts in Notes", "Three files ready in sidebar"], a: 1, explain: "MASTER_TALK_TRACK SETUP: No deploy. No npm. Agent edits files locally." },
      { cat: "demo", q: "First file to show in the demo (step 1) is…", opts: ["package.json", "docs/ARCHITECTURE.md", "README.md", ".gitignore"], a: 1, explain: "Click docs → ARCHITECTURE.md; scroll to Known gaps." },
      { cat: "demo", q: "JIRA-4827 is about…", opts: ["Adding a marketing landing page", "Wiring SOC2 audit logging on questionnaire mutations", "Deleting all tests", "Changing the company logo"], a: 1, explain: "Card A / ARCHITECTURE: audit events missing on POST/PATCH routes." },
      { cat: "demo", q: "SEC-1192 is about…", opts: ["Unauthenticated export endpoint leaking data", "Improving font size in the IDE", "Adding Slack integration", "Removing multi-tenancy"], a: 0, explain: "Card B: pen-test style finding on /v1/internal/export/:questionnaireId." },
      { cat: "demo", q: "PROMPT 1 explicitly says NOT to change yet:", opts: ["The audit logger", "The internal export route", "All route files", "Vitest config"], a: 1, explain: "PROMPT 1: 'Do not change the internal export route yet' — that's PROMPT 2." },
      { cat: "demo", q: "While Agent runs on JIRA-4827, you should keep repeating that…", opts: ["Code merges automatically to production", "Multiple files + Rules + diff for review", "They should cancel their SOC2 program", "Terminal is required"], a: 1, explain: "DEMO_CLICK_ONLY steps 12–13: three lines about files, Rules, PR review." },
      { cat: "demo", q: "If you get lost during the demo, you reorient by opening…", opts: ["GitHub in browser", "demo/MASTER_TALK_TRACK.md", "node_modules", "cursor.com/agents"], a: 1, explain: "DEMO_CLICK_ONLY rule: LEFT → demo → MASTER_TALK_TRACK." },
      { cat: "demo", q: "The onboarding Ask-mode question is about…", opts: ["Multi-tenant isolation on day 3 as a new engineer", "How to order lunch in Portland", "Cursor stock price", "Deleting the codebase"], a: 0, explain: "MASTER_TALK_TRACK Part 2: tenant isolation in questionnaire API." },
      { cat: "demo", q: "If running over time, you can skip…", opts: ["Showing Rules entirely", "SEC-1192 (second Agent prompt)", "The pitch", "Opening Cursor"], a: 1, explain: "MASTER_TALK_TRACK WHEN THINGS GO WRONG: Skip SEC-1192; keep recap." },
      { cat: "demo", q: "If Agent asks 'Proceed?', you should…", opts: ["Close Cursor", "Type yes and press Return", "Open Terminal", "Switch to browser agents"], a: 1, explain: "DEMO_CLICK_ONLY troubleshooting table." },
      { cat: "shortcuts", q: "Open / focus the Agent panel (your welcome-screen shortcut) is…", opts: ["Cmd+Z", "Shift+Cmd+L", "Cmd+Q", "Fn+F1"], a: 1, explain: "MASTER_TALK_TRACK & DEMO_CLICK_ONLY: Shift+Cmd+L." },
      { cat: "shortcuts", q: "Switch between Ask and Agent mode via…", opts: ["Cmd+.", "Cmd+S", "Cmd+P only", "Right-click desktop"], a: 0, explain: "CURSOR_3_MAC_GUIDE: Cmd+. → Mode menu (Ask / Agent)." },
      { cat: "shortcuts", q: "The safest way to find any command if shortcuts feel wrong is…", opts: ["Restart the computer", "Cmd+Shift+P Command Palette", "Uninstall Cursor", "Email support live on the call"], a: 1, explain: "CURSOR_3_MAC_GUIDE Method 1: Command Palette always works." },
      { cat: "shortcuts", q: "For this AE demo you should SKIP…", opts: ["File tree in IDE", "Agents Window and cursor.com/agents", "Showing Rules file", "Agent side panel"], a: 1, explain: "CURSOR_3_MAC_GUIDE surfaces table: NO Agents Window, NO browser agents." },
      { cat: "shortcuts", q: "Shift+Tab in the Agent input box…", opts: ["Deletes the project", "Rotates Agent modes", "Opens GitHub", "Shares screen"], a: 1, explain: "CURSOR_3_MAC_GUIDE: Shift+Tab rotates modes in chat input." },
      { cat: "technical", q: "recordAuditEvent must be called on…", opts: ["Every create/update/delete on questionnaires or responses", "Only GET requests", "Only Sunday deployments", "Never—audit is optional"], a: 0, explain: "responsive-platform.mdc: non-negotiable on mutations." },
      { cat: "technical", q: "Multi-tenant rule: data access must scope by…", opts: ["req.auth.orgId", "Random UUID per request", "Client IP only", "First user in the database"], a: 0, explain: "Rules: never return another org's records." },
      { cat: "technical", q: "Routes under /v1/internal/* without requireAuth need…", opts: ["Nothing—always fine", "Security ticket approval", "A tweet from the CEO", "npm publish"], a: 1, explain: "Rules: never add internal routes without auth unless Security approves." },
      { cat: "technical", q: "The demo repo's intentional gaps are listed in ARCHITECTURE under…", opts: ["Known gaps", "Deprecated forever", "Marketing copy", "License"], a: 0, explain: "ARCHITECTURE.md: JIRA-4827 and SEC-1192 under Known gaps." },
      { cat: "technical", q: "PROMPT 1 says to use audit helper from…", opts: ["src/services/auditLogger.ts", "node_modules/lodash", "public/index.html", "demo/CHECKLIST.md"], a: 0, explain: "PROMPT 1: Use recordAuditEvent from auditLogger.ts." },
      { cat: "technical", q: "Audit action names in rules include…", opts: ["questionnaire.created", "hack.the_planet", "user.party_time", "delete.all_customers"], a: 0, explain: "Rules list: questionnaire.created, status_changed, response.created." },
      { cat: "qa", q: "Privacy Mode means…", opts: ["Code is not persisted for training", "All code is public on GitHub", "No SSO", "Agents cannot edit files"], a: 0, explain: "QA_PREP security: Trust Center + Privacy Mode." },
      { cat: "qa", q: "Cursor does NOT replace…", opts: ["Your CI, SAST, and human reviewers", "The need to ever write code", "Your laptop", "VS Code keybindings"], a: 0, explain: "Security answer: accelerates draft; gates stay the gate." },
      { cat: "qa", q: "A good discovery question to ask the CTO is…", opts: ["What's your favorite color?", "What would a 30-day pilot need to prove?", "Can I skip the demo?", "Do you use Notepad?"], a: 1, explain: "MASTER_TALK_TRACK Part 3 & QA_PREP: pilot success metrics." },
      { cat: "qa", q: "If asked about the unauthenticated export in the demo repo…", opts: ["Deny it exists", "Say it's intentional tech debt we fix with Agent like a pen-test finding", "Blame the customer", "Say Cursor caused the vulnerability"], a: 1, explain: "QA_PREP: intentional demo debt; Agent fixes SEC-1192." },
      { cat: "qa", q: "Responsive engineering has major presence in…", opts: ["Only Antarctica", "Portland HQ and Coimbatore", "Only London", "No remote offices"], a: 1, explain: "SCENARIO_CARDS: HQ Portland; engineering Coimbatore + US." },
      { cat: "traps", q: "During the live demo you should NOT use…", opts: ["Cursor desktop IDE", "cursor.com/agents in the browser", "Rules file", "ARCHITECTURE.md"], a: 1, explain: "MASTER_TALK_TRACK: You do not use cursor.com/agents for this session." },
      { cat: "traps", q: "You should NOT type demo prompts in…", opts: ["Apple Notes (for copy)", "Center code editor", "RIGHT Agent box", "Prepared scratch buffer"], a: 1, explain: "DEMO_CLICK_ONLY screen diagram: center is optional look only." },
      { cat: "traps", q: "For the interview you should NOT…", opts: ["Share Cursor window", "Open GitHub in browser as part of demo flow", "Show .cursor/rules", "Use Agent mode"], a: 1, explain: "START_HERE: not using GitHub in browser during demo." },
      { cat: "traps", q: "The 'Agents Window' (separate dashboard) is…", opts: ["Required for every demo", "Skipped for this AE demo", "The only way to run prompts", "Same as Privacy Mode"], a: 1, explain: "CURSOR_3_MAC_GUIDE: skip Agents Window." },
      { cat: "pitch", q: "Transition line when leaving slides is roughly…", opts: ["Let's see it in practice—I'll share my Cursor window", "I'm done, goodbye", "Open Google Docs", "Let's deploy to production now"], a: 0, explain: "MASTER_TALK_TRACK 04:45 transition off slides." },
      { cat: "demo", q: "Rules file path to show is…", opts: [".cursor/rules/responsive-platform.mdc", "C:\\Windows\\System32", "package-lock.json only", ".env.production"], a: 0, explain: "Step 5 in click card: .cursor → rules → responsive-platform.mdc." },
      { cat: "demo", q: "questionnaires.ts is shown to highlight…", opts: ["TODO(JIRA-4827) cross-file compliance work", "A React component", "Mobile UI", "Database migration to Mongo only"], a: 0, explain: "Point at TODO—don't read TypeScript aloud." },
      { cat: "pitch", q: "Responsive's external value prop you mirror internally is…", opts: ["Speed and trust for questionnaires/RFPs", "Lowest price at any cost", "No security reviews", "AI replaces all responders"], a: 0, explain: "Pitch ties: customers need speed AND accuracy; engineering same microscope." },
      { cat: "qa", q: "Enterprise pricing answer should…", opts: ["Invent exact per-seat dollars on the spot", "Stay high level and offer AE/pilot scoping after alignment", "Refuse to discuss", "Promise free forever"], a: 1, explain: "QA_PREP pricing: per seat tiers; loop AE after pilot scope." },
      { cat: "technical", q: "PROMPT 1 requires tests using…", opts: ["Vitest", "Jest only in browser", "Manual Excel", "No tests"], a: 0, explain: "PROMPT 1: Add vitest tests proving audit events." },
      { cat: "demo", q: "Approximate timing for live demo section is…", opts: ["~5 minutes", "~30 seconds", "~20 minutes", "~2 hours"], a: 0, explain: "Timing cheat sheet: 5:00–9:30 demo beats." },
      { cat: "pitch", q: "Slide 3 includes ramp story for engineers in…", opts: ["Coimbatore on day 3 asking the live codebase", "Only executives", "Only sales", "Only contractors"], a: 0, explain: "MASTER_TALK_TRACK Slide 3: global ramp with same Rules." },
    ];

    const DEMO_STEPS = [
      { where: "LEFT", action: "docs → ARCHITECTURE.md", say: "Small example inspired by security questionnaires." },
      { where: "CENTER", action: "Scroll to Known gaps", say: "Ticket 4827—audit logging missing in places." },
      { where: "LEFT", action: "services → … → routes → questionnaires.ts", say: "Engineers see a TODO like this." },
      { where: "CENTER", action: "Point at TODO(JIRA-4827)", say: "Cross-file compliance work." },
      { where: "LEFT", action: ".cursor → rules → responsive-platform.mdc", say: "Rules—standards for every dev and agent." },
      { where: "CENTER", action: "Scroll Rules slowly", say: "Before AI writes anything." },
      { where: "RIGHT", action: "Click Agent text box", say: "New engineer, day three." },
      { where: "KEYBOARD", action: "Cmd + . → Ask (if menu shows)", say: "" },
      { where: "RIGHT", action: "Paste onboarding question → Return", say: "Same codebase for learning and shipping." },
      { where: "RIGHT", action: "Wait, skim answer", say: "Grounded in your repo." },
      { where: "KEYBOARD", action: "Cmd + . → Agent OR Shift+Tab", say: "Now shipping—not just learning." },
      { where: "RIGHT", action: "Paste PROMPT 1 → Return", say: "Describe outcome; watch files + Rules + diff." },
      { where: "RIGHT", action: "Wait 30–90s, keep talking", say: "Multiple files, Rules, diff for review." },
      { where: "RIGHT", action: "Click file names in Agent reply", say: "Tech lead review—minutes not hours." },
      { where: "RIGHT", action: "Paste PROMPT 2 → Return", say: "Security fix—same workflow." },
      { where: "RIGHT", action: "Wait, glance at changes", say: "Velocity and risk together." },
      { where: "CAMERA", action: "Stop clicking, look at camera", say: "Recap: learn, ship, same PR process. Q&A?" },
    ];

    const SHORTCUT_DRILL = [
      { keys: "Shift + Cmd + L", action: "Open / focus New Agent side panel" },
      { keys: "Cmd + .", action: "Mode menu — switch Ask vs Agent" },
      { keys: "Cmd + Shift + P", action: "Command Palette" },
      { keys: "Shift + Tab", action: "Rotate Agent modes in input" },
      { keys: "Cmd + E", action: "Toggle Agent layout" },
      { keys: "Cmd + I / Cmd + L", action: "Toggle sidepanel (often same)" },
    ];

    const PROMPT_BLANKS = [
      {
        template: "Implement ___: wire SOC2 audit logging for all questionnaire and response mutations.\n\nRequirements:\n- Use ___ from src/services/auditLogger.ts\n- Follow .cursor/rules/responsive-platform.mdc\n- Cover: POST /v1/questionnaires, PATCH .../status, POST .../responses\n- Add ___ tests proving audit events are created\n- Do not change the ___ yet",
        answers: ["JIRA-4827", "recordAuditEvent", "vitest", "internal export route"],
        hints: ["Ticket ID", "Function name", "Test framework", "Saved for PROMPT 2"],
      },
      {
        template: "Fix ___: secure GET /v1/internal/export/:questionnaireId per responsive-platform rules.\nRequire ___ and org scoping.",
        answers: ["SEC-1192", "auth"],
        hints: ["Security ticket", "What the endpoint lacked"],
      },
    ];

    let state = loadState();
    let session = null;

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState();
      } catch {
        return defaultState();
      }
    }
    function defaultState() {
      return { gamesPlayed: 0, bestBoss: 0, streak: 0, lastPlayed: null };
    }
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderStats();
    }

    function renderStats() {
      const el = document.getElementById("statsBar");
      el.innerHTML = `
        <div class="stat">Sessions: <strong>${state.gamesPlayed}</strong></div>
        <div class="stat">Best boss: <strong>${state.bestBoss}%</strong></div>
        <div class="stat">Streak: <strong>${state.streak}</strong></div>
      `;
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startSession(mode, opts = {}) {
      session = {
        mode,
        index: 0,
        correct: 0,
        wrongCats: {},
        items: [],
        answered: false,
        ...opts,
      };

      if (mode === "quiz" || mode === "boss") {
        let pool = QUESTIONS;
        if (mode === "boss") {
          pool = [...QUESTIONS, ...makeSimulatorQuestions(5)];
        } else {
          const cats = opts.categories || Object.keys(CATEGORIES);
          pool = QUESTIONS.filter((q) => cats.includes(q.cat));
        }
        session.items = shuffle(pool).slice(0, mode === "boss" ? 15 : 10).map((q) => ({ type: "mc", ...q }));
      } else if (mode === "simulator") {
        session.items = DEMO_STEPS.map((s, i) => ({
          type: "sim",
          stepIndex: i,
          correct: s,
          opts: makeSimOptions(i),
        }));
      } else if (mode === "shortcuts") {
        session.items = shuffle(SHORTCUT_DRILL).map((item) => ({
          type: "match",
          item,
          opts: shuffle(SHORTCUT_DRILL.map((x) => x.action)),
        }));
      } else if (mode === "prompts") {
        session.items = PROMPT_BLANKS.map((p, pi) => ({
          type: "prompt",
          ...p,
          pi,
        }));
      }

      showScreen("screenPlay");
      renderPlay();
    }

    function makeSimulatorQuestions(n) {
      const out = [];
      for (let i = 0; i < n; i++) {
        const idx = Math.floor(Math.random() * DEMO_STEPS.length);
        const step = DEMO_STEPS[idx];
        const correctAction = step.action;
        const opts = shuffle(makeSimOptions(idx).map((o) => o.action));
        out.push({
          type: "mc",
          cat: "demo",
          q: `Demo step ${idx + 1}: What do you do next?`,
          opts,
          a: opts.indexOf(correctAction),
          explain: `Correct: [${step.where}] ${step.action}. Say: "${step.say}"`,
        });
      }
      return out;
    }

    function makeSimOptions(correctIndex) {
      const correct = DEMO_STEPS[correctIndex];
      const wrongs = shuffle(
        DEMO_STEPS.filter((_, i) => i !== correctIndex)
      ).slice(0, 3);
      return shuffle([correct, ...wrongs]);
    }

    function renderPlay() {
      const item = session.items[session.index];
      const total = session.items.length;
      const pct = ((session.index) / total) * 100;
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("playMeta").textContent =
        `${session.mode} · ${session.index + 1} / ${total}`;
      document.getElementById("playActions").style.display = "none";
      session.answered = false;

      const body = document.getElementById("playBody");
      body.innerHTML = "";

      if (item.type === "mc") {
        body.innerHTML = `<div class="question-text">${escapeHtml(item.q)}</div><div class="options" id="opts"></div><div id="feedback"></div>`;
        const optsEl = document.getElementById("opts");
        item.opts.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.textContent = opt;
          btn.onclick = () => pickMc(i, item);
          optsEl.appendChild(btn);
        });
      } else if (item.type === "sim") {
        const s = item.correct;
        body.innerHTML = `
          <div class="sim-step-num">Step ${item.stepIndex + 1} / ${DEMO_STEPS.length}</div>
          <div class="sim-context">
            <div><strong>Where:</strong> ${escapeHtml(s.where)}</div>
            ${s.say ? `<div class="say">Say: "${escapeHtml(s.say)}"</div>` : ""}
          </div>
          <div class="question-text">What is the correct action?</div>
          <div class="options" id="opts"></div>
          <div id="feedback"></div>
        `;
        const optsEl = document.getElementById("opts");
        item.opts.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.innerHTML = `<span class="keyboard-hint">${escapeHtml(opt.where)}</span> ${escapeHtml(opt.action)}`;
          btn.onclick = () => pickSim(i, item);
          optsEl.appendChild(btn);
        });
      } else if (item.type === "match") {
        body.innerHTML = `
          <div class="question-text">What does <span class="keyboard-hint">${escapeHtml(item.item.keys)}</span> do?</div>
          <div class="options" id="opts"></div>
          <div id="feedback"></div>
        `;
        const optsEl = document.getElementById("opts");
        const choices = shuffle(SHORTCUT_DRILL.map((x) => x.action));
        choices.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "option";
          btn.textContent = opt;
          btn.onclick = () => pickMatch(opt, item);
          optsEl.appendChild(btn);
        });
      } else if (item.type === "prompt") {
        let html = `<div class="question-text">Complete PROMPT ${item.pi + 1}</div>`;
        const parts = item.template.split("___");
        html += '<div class="sim-context" style="font-family:ui-monospace,monospace;font-size:0.82rem">';
        parts.forEach((part, i) => {
          html += escapeHtml(part);
          if (i < item.answers.length) {
            html += `<input data-blank="${i}" placeholder="${escapeHtml(item.hints[i])}" style="width:120px;margin:0 4px;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text)" />`;
          }
        });
        html += '</div><div id="feedback"></div>';
        html += '<div class="btn-row"><button class="btn-primary" id="checkPrompt">Check</button></div>';
        body.innerHTML = html;
        document.getElementById("checkPrompt").onclick = () => checkPrompt(item);
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pickMc(i, item) {
      if (session.answered) return;
      session.answered = true;
      const ok = i === item.a;
      if (ok) session.correct++;
      else session.wrongCats[item.cat] = (session.wrongCats[item.cat] || 0) + 1;
      lockOptions(document.getElementById("opts"), i, item.a);
      showFeedback(ok, item.explain);
    }

    function pickSim(i, item) {
      if (session.answered) return;
      session.answered = true;
      const ok = item.opts[i] === item.correct;
      if (ok) session.correct++;
      else session.wrongCats.demo = (session.wrongCats.demo || 0) + 1;
      const correctIdx = item.opts.indexOf(item.correct);
      lockOptions(document.getElementById("opts"), i, correctIdx);
      const s = item.correct;
      showFeedback(ok, `Correct: [${s.where}] ${s.action}`);
    }

    function pickMatch(choice, item) {
      if (session.answered) return;
      session.answered = true;
      const ok = choice === item.item.action;
      if (ok) session.correct++;
      else session.wrongCats.shortcuts = (session.wrongCats.shortcuts || 0) + 1;
      const optsEl = document.getElementById("opts");
      [...optsEl.children].forEach((btn) => {
        btn.classList.add("locked");
        if (btn.textContent === item.item.action) btn.classList.add("correct");
        if (btn.textContent === choice && !ok) btn.classList.add("wrong");
      });
      showFeedback(ok, `${item.item.keys} → ${item.item.action}`);
    }

    function checkPrompt(item) {
      if (session.answered) return;
      const inputs = [...document.querySelectorAll("[data-blank]")];
      let ok = true;
      const details = [];
      inputs.forEach((inp, i) => {
        const val = inp.value.trim().toLowerCase();
        const expected = item.answers[i].toLowerCase();
        const match = val === expected || val.includes(expected) || expected.includes(val);
        if (!match) ok = false;
        inp.style.borderColor = match ? "var(--success)" : "var(--error)";
        details.push(`${item.hints[i]}: ${item.answers[i]}`);
      });
      session.answered = true;
      if (ok) session.correct++;
      else session.wrongCats.technical = (session.wrongCats.technical || 0) + 1;
      showFeedback(ok, ok ? "Perfect — paste these from Notes in the real demo." : "Expected: " + details.join("; "));
    }

    function lockOptions(optsEl, picked, correctIdx) {
      [...optsEl.children].forEach((btn, idx) => {
        btn.classList.add("locked");
        if (idx === correctIdx) btn.classList.add("correct");
        if (idx === picked && picked !== correctIdx) btn.classList.add("wrong");
      });
    }

    function showFeedback(ok, text) {
      const fb = document.getElementById("feedback");
      fb.className = "feedback " + (ok ? "good" : "bad");
      fb.innerHTML = (ok ? "✓ " : "✗ ") + escapeHtml(text);
      document.getElementById("playActions").style.display = "flex";
      document.getElementById("nextBtn").textContent =
        session.index >= session.items.length - 1 ? "See results" : "Next";
    }

    function finishSession() {
      const total = session.items.length;
      const pct = Math.round((session.correct / total) * 100);
      state.gamesPlayed++;
      state.lastPlayed = new Date().toISOString();
      if (pct === 100) state.streak++;
      else state.streak = 0;
      if (session.mode === "boss" && pct > state.bestBoss) state.bestBoss = pct;
      saveState();

      document.getElementById("progressFill").style.width = "100%";
      document.getElementById("resultScore").textContent = pct + "%";
      let msg = "Keep practicing — open MASTER_TALK_TRACK and run the click card twice.";
      if (pct >= 80) msg = "Demo ready territory. Run the 17 steps with zero talking once more.";
      if (pct === 100) msg = "Perfect. You're dangerous. Go nail the CTO conversation.";
      document.getElementById("resultMessage").textContent = msg;

      const weak = Object.entries(session.wrongCats || {})
        .map(([cat, n]) => `<li>${CATEGORIES[cat]?.label || cat} (${n} miss${n > 1 ? "es" : ""})</li>`)
        .join("");
      document.getElementById("weakList").innerHTML = weak
        ? "<strong>Review:</strong>" + weak
        : "<li>No weak areas this round — nice.</li>";

      showScreen("screenResults");
    }

    function bindEvents() {
      document.querySelectorAll(".mode-card").forEach((card) => {
        card.addEventListener("click", () => {
          const mode = card.dataset.mode;
          if (mode === "quiz") {
            setupCategoryPicks();
            showScreen("screenQuizSetup");
          } else {
            startSession(mode);
          }
        });
      });

      document.querySelectorAll("[data-back]").forEach((b) => {
        b.addEventListener("click", () => showScreen("screenHome"));
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (session.index >= session.items.length - 1) finishSession();
        else {
          session.index++;
          renderPlay();
        }
      });

      document.getElementById("retryBtn").addEventListener("click", () => {
        if (session.mode === "quiz") {
          setupCategoryPicks();
          showScreen("screenQuizSetup");
        } else {
          startSession(session.mode, session.categories ? { categories: session.categories } : {});
        }
      });
    }

    function setupCategoryPicks() {
      const el = document.getElementById("categoryPicks");
      el.innerHTML = "";
      const selected = new Set(Object.keys(CATEGORIES));
      Object.entries(CATEGORIES).forEach(([key, meta]) => {
        const chip = document.createElement("button");
        chip.className = "chip on";
        chip.textContent = meta.label;
        chip.onclick = () => {
          if (selected.has(key)) {
            if (selected.size > 1) {
              selected.delete(key);
              chip.classList.remove("on");
            }
          } else {
            selected.add(key);
            chip.classList.add("on");
          }
          chip.dataset.selected = selected.has(key);
        };
        chip.type = "button";
        chip.dataset.cat = key;
        el.appendChild(chip);
      });
      document.getElementById("startQuiz").onclick = () => {
        const cats = [...el.querySelectorAll(".chip.on")].map((c) => c.dataset.cat);
        startSession("quiz", { categories: cats });
      };
    }

    function init() {
      bindEvents();
      renderStats();
      setupCategoryPicks();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
  <noscript><p style="text-align:center;padding:2rem;color:#ff6b7a">JavaScript is required for this game. Open the file in Chrome or Safari with JS enabled.</p></noscript>
